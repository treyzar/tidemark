name: Ubuntu port checks

on:
  push:
    branches: [feature/ubuntu-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# This checks the port's shared logic and transport adapters. It does not
# publish a Linux release or stand in for the GNOME desktop acceptance tests.
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Test shared Rust logic
        run: cargo test --manifest-path crates/tidemark-core/Cargo.toml --locked

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo test --workspace --release --locked
      - name: Check embedded resource paths
        shell: pwsh
        run: |
          rustc --test build.rs -o "$env:RUNNER_TEMP\resource-path-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\resource-path-tests.exe"

  mpris:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install isolated D-Bus session tool
        run: sudo apt-get update && sudo apt-get install -y dbus
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: crates/tidemark-mpris -> target
      - name: Test MPRIS adapter on an isolated session bus
        run: dbus-run-session -- cargo test --manifest-path crates/tidemark-mpris/Cargo.toml --locked

  gnome-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test bridge logic and cross-language contract
        run: npm test --prefix gnome-extension

  gnome-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TIDEMARK_HARNESS_ARTIFACT_DIR: ${{ runner.temp }}/tidemark-gnome-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install an isolated GNOME test session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gjs gir1.2-gtk-4.0 dbus dbus-daemon dconf-service dconf-gsettings-backend dconf-cli libglib2.0-bin libgl1-mesa-dri mesa-vulkan-drivers
      - name: Exercise the real compositor and authenticated bridge
        run: CI=true bash gnome-extension/integration/run-headless.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gnome-session-${{ matrix.os }}
          path: ${{ runner.temp }}/tidemark-gnome-artifacts
          if-no-files-found: warn
