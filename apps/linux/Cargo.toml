[package]
name = "tidemark"
version = "1.3.0"
edition = "2021"
description = "Tidemark desktop island for Ubuntu (GTK4 + libadwaita)"
publish = false

# Standalone workspace while the Linux app is reviewed. The Windows workspace
# at the repository root stays untouched.
[workspace]

[dependencies]
tidemark-core = { path = "../../crates/tidemark-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.7.2", features = ["v1_5"] }
tidemark-mpris = { path = "../../crates/tidemark-mpris" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
