[package]
name = "tidemark-core"
version = "1.4.0-beta.1"
edition = "2021"
description = "Platform-neutral Tidemark models and contracts shared by the Windows and Linux apps"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
