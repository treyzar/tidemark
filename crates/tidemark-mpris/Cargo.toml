[package]
name = "tidemark-mpris"
version = "0.1.0"
edition = "2021"
description = "Real MPRIS2 adapter for Tidemark on Ubuntu: owner-pinned D-Bus player control"

[workspace]

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zvariant = "5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
async-io = "2"
